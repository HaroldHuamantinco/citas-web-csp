<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Citas Web | Clínica San Pedro — Agenda y paga tu cita en línea</title>
    <meta
      name="description"
      content="Agenda tu cita médica en Clínica San Pedro en menos de 1 minuto: elige a tu especialista, mira horarios en tiempo real y paga 100% seguro."
    />
    <!-- Dirección oficial de la página e indexación -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="Clínica San Pedro" />
    <meta property="og:title" content="Citas Web | Clínica San Pedro" />
    <meta
      property="og:description"
      content="Agenda y paga tu cita médica en menos de 1 minuto, desde tu celular y a cualquier hora."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Agenda tu cita médica en Clínica San Pedro desde tu celular"
    />

    <!-- Vista previa en X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Color de la barra del navegador en celulares -->
    <meta name="theme-color" content="#765cf3" />

    <!-- Íconos de la pestaña y del iPhone -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fuentes: precarga de los pesos más usados -->
    <link
      rel="preload"
      href="/fonts/causten/causten-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/causten/causten-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Poster del Hero: se precarga según el tamaño de pantalla -->
    <link
      rel="preload"
      as="image"
      href="/videos/hero-poster-mobile.webp"
      media="(max-width: 47.99rem)"
    />
    <link
      rel="preload"
      as="image"
      href="/videos/hero-poster-desktop.webp"
      media="(min-width: 48rem)"
    />

    <!-- Íconos: Google Material Symbols (solo los que usamos, en orden alfabético) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=arrow_outward,article,badge,biotech,calendar_month,call,close,credit_card,event_available,expand_more,groups,keyboard_double_arrow_right,location_on,lock,medical_services,medication,menu,person_search,physical_therapy,play_arrow,schedule,sell,stethoscope,support_agent&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
